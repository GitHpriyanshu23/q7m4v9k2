<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1410" viewBox="0 0 1440 1410">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#819889"/></marker></defs>
<rect width="1440" height="100%" fill="#fafbf7"/>
<text x="48" y="45" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#285840">WINDWARD / TECHNICAL HANDOVER</text>
<text x="48" y="88" font-family="Georgia,serif" font-size="34" fill="#243e30">From buying decision to measured outcome</text>
<text x="48" y="118" font-family="Arial,sans-serif" font-size="15" fill="#64786a">Green: information and history available by the decision cutoff. Amber: explicitly retrospective evaluation.</text>
<path d="M720 275 L720 325" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M720 425 L720 475" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M720 595 L720 665" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="737.5" y="620" width="105" height="22" rx="3" fill="#fafbf7"/>
<text x="790" y="635" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64786a">Forecast data</text>
<path d="M555 375 L230 375 L230 475" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="263.5" y="343" width="133" height="22" rx="3" fill="#fafbf7"/>
<text x="330" y="358" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64786a">Time-safe history</text>
<path d="M230 595 L230 665" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M230 785 L230 855" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M395 915 L465 915 L465 725 L555 725" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="433.5" y="807" width="63" height="22" rx="3" fill="#fafbf7"/>
<text x="465" y="822" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64786a">Context</text>
<path d="M885 535 L1045 535" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="912.5" y="502" width="105" height="22" rx="3" fill="#fafbf7"/>
<text x="965" y="517" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64786a">Compare later</text>
<path d="M1210 595 L1210 665" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1210 785 L1210 855" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1210 975 L1210 1100 L885 1100" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="982.0" y="1067" width="126" height="22" rx="3" fill="#fafbf7"/>
<text x="1045" y="1082" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64786a">Measured results</text>
<path d="M720 785 L720 1040" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
<rect x="730.5" y="905" width="119" height="22" rx="3" fill="#fafbf7"/>
<text x="790" y="920" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64786a">Optional review</text>
<path d="M720 1160 L720 1230" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="555" y="175" width="330" height="100" rx="10" fill="#285840" stroke="#285840" stroke-width="1.5"/>
<text x="573" y="204" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">1. Select the decision</text>
<text x="573" y="230" font-family="Arial,sans-serif" font-size="14" fill="#e4eddf">January date + cutoff (09:00 default)</text>
<text x="573" y="252" font-family="Arial,sans-serif" font-size="14" fill="#e4eddf">Delivery is the following day</text>
<rect x="555" y="325" width="330" height="100" rx="10" fill="#ffffff" stroke="#cbd8c9" stroke-width="1.5"/>
<text x="573" y="354" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">2. Validate and load</text>
<text x="573" y="380" font-family="Arial,sans-serif" font-size="14" fill="#64786a">FastAPI checks dates and time</text>
<text x="573" y="402" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Use cached indexes of bundled data</text>
<rect x="555" y="475" width="330" height="120" rx="10" fill="#edf3e7" stroke="#9eb391" stroke-width="1.5"/>
<text x="573" y="504" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">3. Reconstruct the forecast</text>
<text x="573" y="530" font-family="Arial,sans-serif" font-size="14" fill="#64786a">For each next-day delivery hour:</text>
<text x="573" y="552" font-family="Arial,sans-serif" font-size="14" fill="#64786a">latest publication at/before cutoff</text>
<text x="573" y="574" font-family="Arial,sans-serif" font-size="14" fill="#64786a">No eligible forecast stays missing</text>
<rect x="555" y="665" width="330" height="120" rx="10" fill="#ffffff" stroke="#cbd8c9" stroke-width="1.5"/>
<text x="573" y="694" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">4. Show the buying outlook</text>
<text x="573" y="720" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Forecast curve and energy total</text>
<text x="573" y="742" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Publication age, lead time, audit trail</text>
<text x="573" y="764" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Prior context shown alongside</text>
<rect x="65" y="475" width="330" height="120" rx="10" fill="#ffffff" stroke="#cbd8c9" stroke-width="1.5"/>
<text x="83" y="504" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">Earlier January decisions</text>
<text x="83" y="530" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Only decisions before the chosen date</text>
<text x="83" y="552" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Use the same selected cutoff policy</text>
<text x="83" y="574" font-family="Arial,sans-serif" font-size="14" fill="#64786a">No full-month hindsight</text>
<rect x="65" y="665" width="330" height="120" rx="10" fill="#ffffff" stroke="#cbd8c9" stroke-width="1.5"/>
<text x="83" y="694" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">Actuals available at cutoff</text>
<text x="83" y="720" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Only versions already published</text>
<text x="83" y="742" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Average both actual half-hours</text>
<text x="83" y="764" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Exclude future hours and revisions</text>
<rect x="65" y="855" width="330" height="120" rx="10" fill="#edf3e7" stroke="#9eb391" stroke-width="1.5"/>
<text x="83" y="884" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">Prior-history context</text>
<text x="83" y="910" font-family="Arial,sans-serif" font-size="14" fill="#64786a">MAE, bias, P90 shortfall and count</text>
<text x="83" y="932" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Descriptive sample history only</text>
<text x="83" y="954" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Not a guaranteed reserve</text>
<rect x="1045" y="475" width="330" height="120" rx="10" fill="#fcf6e9" stroke="#d3b784" stroke-width="1.5"/>
<text x="1063" y="504" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">Retrospective actuals</text>
<text x="1063" y="530" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Latest versions in fixed snapshot</text>
<text x="1063" y="552" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Never presented as known beforehand</text>
<text x="1063" y="574" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Not an additional live data fetch</text>
<rect x="1045" y="665" width="330" height="120" rx="10" fill="#fcf6e9" stroke="#d3b784" stroke-width="1.5"/>
<text x="1063" y="694" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">Align actuals to the hour</text>
<text x="1063" y="720" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Mean of HH:00 and HH:30 actuals</text>
<text x="1063" y="742" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Both half-hours must exist</text>
<text x="1063" y="764" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Missing remains null; zero is valid</text>
<rect x="1045" y="855" width="330" height="120" rx="10" fill="#fcf6e9" stroke="#d3b784" stroke-width="1.5"/>
<text x="1063" y="884" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">Compute matched errors</text>
<text x="1063" y="910" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Error = forecast minus actual</text>
<text x="1063" y="932" font-family="Arial,sans-serif" font-size="14" fill="#64786a">MAE, RMSE, bias, shortfall energy</text>
<text x="1063" y="954" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Report matched / expected coverage</text>
<rect x="555" y="1040" width="330" height="120" rx="10" fill="#fcf6e9" stroke="#d3b784" stroke-width="1.5"/>
<text x="573" y="1069" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">5. Review the outcomes</text>
<text x="573" y="1095" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Reveal actuals or open performance</text>
<text x="573" y="1117" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Charts, hourly patterns, worst intervals</text>
<text x="573" y="1139" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Clearly labelled retrospective</text>
<rect x="555" y="1230" width="330" height="100" rx="10" fill="#edf3e7" stroke="#9eb391" stroke-width="1.5"/>
<text x="573" y="1259" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">6. Export for review</text>
<text x="573" y="1285" font-family="Arial,sans-serif" font-size="14" fill="#64786a">CSV keeps selected dates and cutoff</text>
<text x="573" y="1307" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Forecast, actual, error, timestamps</text>
<text x="48" y="1385" font-family="Arial,sans-serif" font-size="12" fill="#64786a">Source: implemented analysis rules. January 1–31 decisions deliver January 2–February 1. National wind exposure is not a client purchase order.</text>
</svg>