<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#819889"/></marker></defs>
<rect width="1440" height="100%" fill="#fafbf7"/>
<text x="48" y="45" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#285840">WINDWARD / TECHNICAL HANDOVER</text>
<text x="48" y="88" font-family="Georgia,serif" font-size="34" fill="#243e30">How Windward is built</text>
<text x="48" y="118" font-family="Arial,sans-serif" font-size="15" fill="#64786a">Offline preparation is separate from interactive analysis. Vercel and Docker are different deployment paths.</text>
<rect x="40" y="160" width="1360" height="220" rx="15" fill="#f0f4eb" stroke="#dce4d8"/>
<text x="62" y="191" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#64786a">01 / OFFLINE DATA PREPARATION</text>
<rect x="40" y="410" width="1360" height="410" rx="15" fill="#f5f6f1" stroke="#dce4d8"/>
<text x="62" y="441" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#64786a">02 / INTERACTIVE REQUEST AND ANALYSIS</text>
<rect x="40" y="840" width="1360" height="205" rx="15" fill="#f5f6f1" stroke="#dce4d8"/>
<text x="62" y="871" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#64786a">03 / TWO WAYS TO RUN THE SAME APPLICATION</text>
<path d="M400 270 L555 270" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="432.5" y="237" width="91" height="22" rx="3" fill="#fafbf7"/>
