<path d="M885 270 L1040 270" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="902.5" y="237" width="119" height="22" rx="3" fill="#fafbf7"/>
<text x="962" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64786a">Validated files</text>
<path d="M400 515 L555 515" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="436.0" y="483" width="84" height="22" rx="3" fill="#fafbf7"/>
<text x="478" y="498" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64786a">GET /api/*</text>
<path d="M555 570 L400 570" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="436.0" y="538" width="84" height="22" rx="3" fill="#fafbf7"/>
<text x="478" y="553" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64786a">JSON / CSV</text>
<path d="M885 515 L1040 515" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="920.0" y="483" width="84" height="22" rx="3" fill="#fafbf7"/>
<text x="962" y="498" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64786a">Parameters</text>
<path d="M1040 570 L885 570" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="930.5" y="538" width="63" height="22" rx="3" fill="#fafbf7"/>
<text x="962" y="553" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64786a">Results</text>
<path d="M1370 285 L1390 285 L1390 735 L1370 735" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
<path d="M1205 685 L1205 610" fill="none" stroke="#9aafa0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1226.0" y="636" width="98" height="22" rx="3" fill="#fafbf7"/>
<text x="1275" y="651" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64786a">Indexed data</text>
<rect x="70" y="210" width="330" height="120" rx="10" fill="#edf3e7" stroke="#9eb391" stroke-width="1.5"/>
<text x="88" y="239" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">Elexon public APIs</text>
<text x="88" y="265" font-family="Arial,sans-serif" font-size="14" fill="#64786a">WINDFOR: forecast + publication time</text>
<text x="88" y="287" font-family="Arial,sans-serif" font-size="14" fill="#64786a">FUELHH: half-hour actuals, WIND only</text>
<text x="88" y="309" font-family="Arial,sans-serif" font-size="14" fill="#64786a">No additional market datasets</text>
<rect x="555" y="210" width="330" height="120" rx="10" fill="#ffffff" stroke="#cbd8c9" stroke-width="1.5"/>
<text x="573" y="239" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">Offline ingestion</text>
<text x="573" y="265" font-family="Arial,sans-serif" font-size="14" fill="#64786a">scripts/ingest.py — manual run</text>
<text x="573" y="287" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Download, retry, validate, normalize</text>
<text x="573" y="309" font-family="Arial,sans-serif" font-size="14" fill="#64786a">No download on a dashboard request</text>
<rect x="1040" y="210" width="330" height="120" rx="10" fill="#edf3e7" stroke="#9eb391" stroke-width="1.5"/>
<text x="1058" y="239" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">Bundled evidence</text>
<text x="1058" y="265" font-family="Arial,sans-serif" font-size="14" fill="#64786a">windfor.json.gz + fuelhh.json.gz</text>
<text x="1058" y="287" font-family="Arial,sans-serif" font-size="14" fill="#64786a">manifest.json: URLs, time, counts, hashes</text>
<text x="1058" y="309" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Fixed historical snapshot; no database</text>
<rect x="70" y="470" width="330" height="140" rx="10" fill="#ffffff" stroke="#cbd8c9" stroke-width="1.5"/>
<text x="88" y="499" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">Buyer / React browser app</text>
<text x="88" y="525" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Date, cutoff, date range, view selection</text>
<text x="88" y="547" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Recharts, audit trail, actuals toggle</text>
<text x="88" y="569" font-family="Arial,sans-serif" font-size="14" fill="#64786a">TypeScript + Vite; same-origin requests</text>
<text x="88" y="591" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Does not calculate accuracy formulas</text>
<rect x="555" y="470" width="330" height="140" rx="10" fill="#ffffff" stroke="#cbd8c9" stroke-width="1.5"/>
<text x="573" y="499" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">Python FastAPI</text>
<text x="573" y="525" font-family="Arial,sans-serif" font-size="14" fill="#64786a">backend/main.py + api/index.py</text>
<text x="573" y="547" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Validate request; call analysis functions</text>
<text x="573" y="569" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Decision, performance, metadata, CSV</text>
<text x="573" y="591" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Return computed JSON or CSV</text>
<rect x="1040" y="470" width="330" height="140" rx="10" fill="#edf3e7" stroke="#9eb391" stroke-width="1.5"/>
<text x="1058" y="499" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">Pure analysis functions</text>
<text x="1058" y="525" font-family="Arial,sans-serif" font-size="14" fill="#64786a">backend/analysis.py</text>
<text x="1058" y="547" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Latest publication at/before cutoff</text>
<text x="1058" y="569" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Average two half-hour actuals</text>
<text x="1058" y="591" font-family="Arial,sans-serif" font-size="14" fill="#64786a">MAE, RMSE, bias, shortfall, coverage</text>
<rect x="1040" y="685" width="330" height="100" rx="10" fill="#ffffff" stroke="#cbd8c9" stroke-width="1.5"/>
<text x="1058" y="714" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">Memory cache / indexes</text>
<text x="1058" y="740" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Lazy load per Python process</text>
<text x="1058" y="762" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Snapshot indexes + selected-day results</text>
<rect x="70" y="685" width="815" height="100" rx="10" fill="#fcf6e9" stroke="#d3b784" stroke-width="1.5"/>
<text x="88" y="714" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">Two separate information views</text>
<text x="88" y="740" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Decision context: earlier decisions and actual versions available by current cutoff.</text>
<text x="88" y="762" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Retrospective review: latest actual versions in the bundled snapshot.</text>
<rect x="70" y="890" width="630" height="120" rx="10" fill="#edf3e7" stroke="#9eb391" stroke-width="1.5"/>
<text x="88" y="919" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">Current public deployment — Vercel</text>
<text x="88" y="945" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Static React assets served by Vercel</text>
<text x="88" y="967" font-family="Arial,sans-serif" font-size="14" fill="#64786a">/api/* rewrites to a Python function exposing FastAPI</text>
<text x="88" y="989" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Snapshot files are included in the function bundle</text>
<rect x="740" y="890" width="630" height="120" rx="10" fill="#ffffff" stroke="#cbd8c9" stroke-width="1.5"/>
<text x="758" y="919" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243e30">Separate container path — Docker</text>
<text x="758" y="945" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Node build stage creates the React production files</text>
<text x="758" y="967" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Non-root Python + Uvicorn serves UI and API together</text>
<text x="758" y="989" font-family="Arial,sans-serif" font-size="14" fill="#64786a">Docker Compose gives one-command local startup</text>
<text x="48" y="1075" font-family="Arial,sans-serif" font-size="12" fill="#64786a">Source: implemented repository. Pilot has no live ingestion scheduler, shared database, trained wind model, or trade execution.</text>
</svg>